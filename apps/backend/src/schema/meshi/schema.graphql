extend type Query {
  meshi(id: ID!): Meshi
  meshis(query: String, first: Int = 20, after: String): MeshiConnection!
}

type Meshi {
  id: ID!
  articleId: String!
  title: String!
  imageUrl: String!
  imageUrls: [String!]!
  placesImageUrls: [String!]!
  storeName: String!
  address: String!
  siteUrl: String!
  publishedDate: Date!
  latitude: Float!
  longitude: Float!
  phone: String
  businessHours: String
  holiday: String
  parking: String
  paymentMethods: String
  officialUrl: String
  snsUrl: String
  theme: String
  sourceVerifiedAt: Date
  createdAt: Date!
  municipality: Municipality
  socialMentions: [SocialMention!]!
}

type SocialMention {
  id: ID!
  platform: String!
  url: String!
  note: String
  createdAt: Date!
}

type MeshiConnection {
  edges: [MeshiEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type MeshiEdge {
  cursor: String!
  node: Meshi!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}
